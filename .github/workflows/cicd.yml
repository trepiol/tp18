name: TP18 — Build Once y cinco auditorías

on:
  push:
    branches: [main, develop, 'feature/**', 'test/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: tp16-notes-backend
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: v0.74.0

jobs:
  legacy-lint:
    name: Lint histórico TP06
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 yamllint
      - name: Lint Python legado si está presente
        shell: bash
        run: |
          if [[ -d devops-TP06/backend ]]; then
            flake8 devops-TP06/backend/ --max-line-length=100 --count --statistics
          else
            echo "Se omite el lint histórico: devops-TP06/backend no existe."
          fi

  test-integrated-app:
    name: Tests App Integrada TP12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devops-tp12/app/backend/requirements-dev.txt
      - run: pip install -r devops-tp12/app/backend/requirements-dev.txt
      - run: |
          flake8 devops-tp12/app/backend/app.py --max-line-length=100 --extend-ignore=E302,E701,E702,W391
          cd devops-tp12/app/backend
          pytest tests/ --cov=. --cov-report=term-missing -v

  build-and-package:
    name: Fase 1 — Build una vez y empaquetar
    runs-on: ubuntu-24.04
    needs: [test-integrated-app]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend integrado
        run: docker build --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" devops-tp12/app/backend
      - name: Guardar imagen para los jobs siguientes
        run: |
          mkdir -p dist
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o dist/backend-image.tar
          sha256sum dist/backend-image.tar > dist/backend-image.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
          retention-days: 1
          compression-level: 0

  trivy-andon-cord:
    name: Fase 2A — Andon Cord Trivy
    runs-on: ubuntu-24.04
    needs: build-and-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - name: Verificar e importar imagen inmutable
        run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Lint del chart y renderizado de producción
        run: |
          helm lint devops-tp12/chart -f devops-tp12/values-prod.yaml
          helm template tp16 devops-tp12/chart -f devops-tp12/values-prod.yaml > manifests-rendered-prod.yaml
          python3 -c "import yaml; p='manifests-rendered-prod.yaml'; d=list(yaml.safe_load_all(open(p))); assert d and all(x is None or isinstance(x,dict) for x in d); print(f'YAML válido: {sum(x is not None for x in d)} documentos')"
      - name: Preparar inventario SCA de producción y desarrollo
        id: prepare
        run: |
          bash scripts/preparar-trivy-sca.sh
          mkdir -p .security-private/trivy-high
          chmod 700 .security-private/trivy-high
          cp manifests-rendered-prod.yaml .security-private/trivy-high/manifests-rendered-prod.yaml
      - name: Trivy SCA HIGH/CRITICAL
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .trivy-sca
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          exit-code: '1'
          output: .security-private/trivy-high/trivy-fs-blocking.json
      - name: Trivy secretos en código backend
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: devops-tp12/app/backend
          scanners: secret
          severity: HIGH,CRITICAL
          format: json
          exit-code: '1'
          output: .security-private/trivy-high/trivy-secrets-blocking.json
      - name: Trivy Container HIGH/CRITICAL
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          exit-code: '1'
          output: .security-private/trivy-high/trivy-image-blocking.json
      - name: Trivy IaC HIGH/CRITICAL sobre YAML renderizado
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: manifests-rendered-prod.yaml
          severity: HIGH,CRITICAL
          format: json
          exit-code: '1'
          output: .security-private/trivy-high/trivy-config-blocking.json
      - name: Resumen del Andon Cord
        if: always()
        shell: bash
        run: |
          {
            echo "### TP16 — Andon Cord Trivy"
            echo
            echo "Imagen: ${IMAGE_NAME}:${IMAGE_TAG} (artifact build-once)."
            echo "HIGH/CRITICAL bloquean SCA, imagen e IaC con exit code 1."
            echo "IaC: manifests-rendered-prod.yaml (Render First)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validar y sanitizar JSON de Trivy
        id: reports
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: >-
          python3 scripts/security_report.py prepare trivy .security-private/trivy-high .security-reports/trivy-high
          --version 0.74.0 --files trivy-fs-blocking.json trivy-secrets-blocking.json trivy-image-blocking.json trivy-config-blocking.json manifests-rendered-prod.yaml
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.reports.outcome == 'success' }}
        with:
          name: tp18-trivy-high-${{ github.sha }}
          path: .security-reports/trivy-high/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  trivy-audit-report:
    name: Fase 2B — Auditoría Trivy LOW/MEDIUM
    runs-on: ubuntu-24.04
    needs: [build-and-package, trivy-andon-cord]
    if: ${{ always() && needs.build-and-package.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Renderizar manifiestos de producción
        run: helm template tp16 devops-tp12/chart -f devops-tp12/values-prod.yaml > manifests-rendered-prod.yaml
      - name: Preparar inventario SCA de producción y desarrollo
        id: prepare
        run: |
          bash scripts/preparar-trivy-sca.sh
          mkdir -p .security-private/trivy-low
          chmod 700 .security-private/trivy-low
          cp manifests-rendered-prod.yaml .security-private/trivy-low/manifests-rendered-prod.yaml
      - name: Escaneo informativo SCA
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .trivy-sca
          scanners: vuln,secret
          severity: LOW,MEDIUM
          format: json
          output: .security-private/trivy-low/trivy-fs-report.json
          exit-code: '0'
      - name: Reporte de secretos del backend
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: devops-tp12/app/backend
          scanners: secret
          format: json
          output: .security-private/trivy-low/trivy-secrets-report.json
          exit-code: '0'
      - name: Escaneo informativo de imagen
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: LOW,MEDIUM
          format: json
          output: .security-private/trivy-low/trivy-image-report.json
          exit-code: '0'
      - name: Escaneo informativo IaC
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: manifests-rendered-prod.yaml
          severity: LOW,MEDIUM
          format: json
          output: .security-private/trivy-low/trivy-config-report.json
          exit-code: '0'
      - name: Resumen informativo
        if: always()
        run: |
          echo "### Reporte Trivy LOW/MEDIUM" >> "$GITHUB_STEP_SUMMARY"
          echo "Ver los resultados informativos en el artifact JSON." >> "$GITHUB_STEP_SUMMARY"
      - name: Validar y sanitizar JSON de Trivy
        id: reports
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: >-
          python3 scripts/security_report.py prepare trivy .security-private/trivy-low .security-reports/trivy-low
          --version 0.74.0 --files trivy-fs-report.json trivy-secrets-report.json trivy-image-report.json trivy-config-report.json manifests-rendered-prod.yaml
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.reports.outcome == 'success' }}
        with:
          name: tp18-trivy-low-${{ github.sha }}
          path: .security-reports/trivy-low/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  gitleaks-andon-cord:
    name: TP17 — Andon Cord Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_CONFIG: .gitleaks.toml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos en los commits del evento
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # La Action limita push/PR al evento; este paso exige todo el historial.
      - name: Verificar también el historial completo
        shell: bash
        run: |
          set -euo pipefail
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          test -s "$GITLEAKS_CONFIG"
          gitleaks git . --config "$GITLEAKS_CONFIG" --redact=100 \
            --log-opts=--all --exit-code=1 --no-banner

      - name: Resumen seguro del Andon Gitleaks
        if: ${{ always() }}
        shell: bash
        env:
          TP17_ANDON_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### TP17 — Andon Cord Gitleaks"
            echo
            echo "Estado de los pasos previos: **${TP17_ANDON_STATUS}**."
            echo "Gitleaks: **${GITLEAKS_VERSION}**; configuración: .gitleaks.toml."
            echo "Un hallazgo no exceptuado o un error operativo bloquea publicación/deploy."
            echo "Este resumen no modifica el resultado bloqueante ni muestra secretos."
          } >> "$GITHUB_STEP_SUMMARY"

  gitleaks-audit-report:
    name: TP18 — Auditoría histórica Gitleaks
    runs-on: ubuntu-24.04
    needs: [gitleaks-andon-cord]
    if: ${{ always() }}
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_CONFIG: .gitleaks.toml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Instalar CLI con checksum verificado
        run: bash scripts/install-security-cli.sh gitleaks
      - name: Auditar historial y preparar JSON compatible sin secretos
        id: audit
        run: bash scripts/audit-gitleaks.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.audit.outcome == 'success' }}
        with:
          name: tp18-gitleaks-${{ github.sha }}
          path: .security-reports/gitleaks/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error


  semgrep:
    name: Fase 2 — Semgrep
    uses: ./.github/workflows/semgrep.yml
    permissions:
      contents: read
      security-events: write

  zap-audit:
    name: Fase 2 — OWASP ZAP aislado
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [build-and-package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - name: Restaurar exactamente la imagen Build Once
        run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - name: Descargar imágenes auxiliares fijadas
        run: |
          python3 - <<'PY'
          import json,subprocess
          tools=json.load(open("security/tools.json"))
          for key in ("zap_image", "postgres_image"):
              subprocess.run(["docker", "pull", tools[key]], check=True)
          PY
      - name: Escanear sólo el entorno efímero interno
        id: audit
        run: bash scripts/audit-zap.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.audit.outcome == 'success' }}
        with:
          name: tp18-zap-${{ github.sha }}
          path: .security-reports/zap/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  threat-modeling:
    name: Fase 2 — Threagile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Descargar Threagile fijado
        run: |
          image=$(python3 -c 'import json; print(json.load(open("security/tools.json"))["threagile_image"])')
          docker pull "$image"
      - name: Analizar modelo y validar risks.json
        id: audit
        run: bash scripts/audit-threagile.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.audit.outcome == 'success' }}
        with:
          name: tp18-threagile-${{ github.sha }}
          path: .security-reports/threagile/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  collect-security-reports:
    name: Fase 3 preparada — Recopilar evidencias sin DefectDojo
    runs-on: ubuntu-24.04
    needs:
      - build-and-package
      - semgrep
      - zap-audit
      - threat-modeling
      - trivy-andon-cord
      - trivy-audit-report
      - gitleaks-andon-cord
      - gitleaks-audit-report
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar sólo artifacts de esta ejecución y SHA
        uses: actions/download-artifact@v4
        with:
          pattern: tp18-*-${{ github.sha }}
          path: .security-bundles/
          merge-multiple: false
      - name: Validar identidad, checksums, formatos y reportes ausentes
        if: ${{ always() }}
        env:
          TP18_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/security_report.py collect .security-bundles .security-collection
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tp18-collection-${{ github.sha }}
          path: .security-collection/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  deploy-k8s-helm:
    name: Fase 4 — Publicación y deploy Helm
    runs-on: ubuntu-24.04
    needs:
      - build-and-package
      - trivy-andon-cord
      - trivy-audit-report
      - gitleaks-andon-cord
      - gitleaks-audit-report
      - semgrep
      - zap-audit
      - threat-modeling
      - collect-security-reports
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.build-and-package.result == 'success' &&
          needs.trivy-andon-cord.result == 'success' &&
          needs.trivy-audit-report.result == 'success' &&
          needs.gitleaks-andon-cord.result == 'success' &&
          needs.gitleaks-audit-report.result == 'success' &&
          needs.semgrep.result == 'success' &&
          needs.zap-audit.result == 'success' &&
          needs.threat-modeling.result == 'success' &&
          needs.collect-security-reports.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp16-backend-image-${{ github.sha }}
          path: dist/
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
      - name: Restaurar imagen construida en Fase 1
        run: |
          sha256sum -c dist/backend-image.tar.sha256
          docker load -i dist/backend-image.tar
      - name: Publicar imagen y desplegar si hay secretos/contexto
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Deploy omitido: configurar DOCKERHUB_USERNAME y DOCKERHUB_TOKEN en GitHub Actions Secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          image="$DOCKERHUB_USERNAME/tp16-notes-backend"
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$image:$IMAGE_TAG"
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$image:$IMAGE_TAG"
          if [[ -z "$KUBECONFIG_B64" ]]; then
            echo "Imagen publicada; deploy omitido: falta KUBECONFIG_B64." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$POSTGRES_USER" || -z "$POSTGRES_PASSWORD" || -z "$POSTGRES_DB" ]]; then
            echo "Imagen publicada; deploy omitido: faltan POSTGRES_USER, POSTGRES_PASSWORD o POSTGRES_DB." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl create namespace devops-portfolio --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic tp16-postgres-credentials -n devops-portfolio \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install tp16 devops-tp12/chart \
            -n devops-portfolio -f devops-tp12/values-prod.yaml \
            --set-string backend.image.repository="$image" \
            --set-string backend.image.tag="$IMAGE_TAG" \
            --wait --timeout 5m
          echo "Imagen $image:$IMAGE_TAG publicada; Helm release aplicado." >> "$GITHUB_STEP_SUMMARY"
