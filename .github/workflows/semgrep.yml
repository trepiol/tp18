name: TP18 — Reusable Semgrep SAST

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-scan:
    name: SAST multilenguaje y Andon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Instalar Semgrep fijado
        run: python3 -m pip install semgrep==1.177.0
      - name: Auditar con las reglas heredadas y validar JSON
        id: audit
        run: bash scripts/audit-semgrep.sh
      - name: Publicar reportes sanitizados
        if: ${{ always() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tp18-semgrep-${{ github.sha }}
          path: .security-reports/semgrep/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Cargar SARIF del mismo análisis
        if: ${{ always() && steps.audit.outcome == 'success' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .security-reports/semgrep/semgrep.sarif
      - name: Guard estricto heredado
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .security-private/semgrep
          chmod 700 .security-private/semgrep
          semgrep scan --config=p/owasp-top-ten --severity=ERROR --error \
            devops-tp12/app devops-tp12/chart \
            devops-tp12/monitoring-k8s-manifests.yaml guia-11 \
            > .security-private/semgrep/gate.log 2>&1
      - name: Resumen seguro
        if: ${{ always() }}
        env:
          TP18_STATUS: ${{ job.status }}
        run: |
          echo "### TP18 — Semgrep" >> "$GITHUB_STEP_SUMMARY"
          echo "Estado: $TP18_STATUS. El guard ERROR conserva su resultado bloqueante." >> "$GITHUB_STEP_SUMMARY"
