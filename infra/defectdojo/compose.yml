# Adapted from official DefectDojo CE 3.4.101 docker-compose.yml.
# No database/cache ports are published; credentials are supplied privately.
services:
  nginx:
    image: docker.io/defectdojo/defectdojo-nginx:3.4.101@sha256:493a177f98e48bd10f10fcf021de71c755329f346568a88b303f71fc3ddc082c
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: ${NGINX_METRICS_ENABLED:-false}
      DD_UWSGI_HOST: ${DD_UWSGI_HOST:-uwsgi}
      DD_UWSGI_PORT: ${DD_UWSGI_PORT:-3031}
    volumes:
    - defectdojo_media:/usr/share/nginx/html/media
    ports:
    - 127.0.0.1:8080:8080
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
  uwsgi:
    image: docker.io/defectdojo/defectdojo-django:3.4.101@sha256:82782841f0298bdafd4bb7f07eaf4cb88ccab60c33d0bb85321e5e3dd0c622b5
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
    - /wait-for-it.sh
    - ${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}
    - -t
    - '30'
    - --
    - /entrypoint-uwsgi.sh
    environment:
      DD_DEBUG: 'False'
      DD_DJANGO_METRICS_ENABLED: ${DD_DJANGO_METRICS_ENABLED:-False}
      DD_ALLOWED_HOSTS: localhost,127.0.0.1
      DD_DATABASE_URL: ${DD_DATABASE_URL:?Private environment required}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: ${DD_SECRET_KEY:?Private environment required}
      DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?Private environment
        required}
      DD_DATABASE_READINESS_TIMEOUT: '120'
      DD_SITE_URL: http://localhost:8080
      DD_CELERY_WORKER_CONCURRENCY: '2'
    volumes:
    - type: bind
      source: ./docker/extra_settings
      target: /app/docker/extra_settings
    - defectdojo_media:${DD_MEDIA_ROOT:-/app/media}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('127.0.0.1',3031),5).close()
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 2g
  celerybeat:
    image: docker.io/defectdojo/defectdojo-django:3.4.101@sha256:82782841f0298bdafd4bb7f07eaf4cb88ccab60c33d0bb85321e5e3dd0c622b5
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
    - /wait-for-it.sh
    - ${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}
    - -t
    - '30'
    - --
    - /entrypoint-celery-beat.sh
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL:?Private environment required}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: ${DD_SECRET_KEY:?Private environment required}
      DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?Private environment
        required}
      DD_DATABASE_READINESS_TIMEOUT: '120'
      DD_ALLOWED_HOSTS: localhost,127.0.0.1
      DD_SITE_URL: http://localhost:8080
      DD_CELERY_WORKER_CONCURRENCY: '2'
    volumes:
    - type: bind
      source: ./docker/extra_settings
      target: /app/docker/extra_settings
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 512m
  celeryworker:
    image: docker.io/defectdojo/defectdojo-django:3.4.101@sha256:82782841f0298bdafd4bb7f07eaf4cb88ccab60c33d0bb85321e5e3dd0c622b5
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint:
    - /wait-for-it.sh
    - ${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}
    - -t
    - '30'
    - --
    - /entrypoint-celery-worker.sh
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL:?Private environment required}
      DD_CELERY_BROKER_URL: ${DD_CELERY_BROKER_URL:-redis://valkey:6379/0}
      DD_CACHE_URL: ${DD_CACHE_URL:-redis://valkey:6379/1}
      DD_SECRET_KEY: ${DD_SECRET_KEY:?Private environment required}
      DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?Private environment
        required}
      DD_DATABASE_READINESS_TIMEOUT: '120'
      DD_ALLOWED_HOSTS: localhost,127.0.0.1
      DD_SITE_URL: http://localhost:8080
      DD_CELERY_WORKER_CONCURRENCY: '2'
    volumes:
    - type: bind
      source: ./docker/extra_settings
      target: /app/docker/extra_settings
    - defectdojo_media:${DD_MEDIA_ROOT:-/app/media}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 2g
  initializer:
    image: docker.io/defectdojo/defectdojo-django:3.4.101@sha256:82782841f0298bdafd4bb7f07eaf4cb88ccab60c33d0bb85321e5e3dd0c622b5
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
    - /wait-for-it.sh
    - ${DD_DATABASE_HOST:-postgres}:${DD_DATABASE_PORT:-5432}
    - --
    - /entrypoint-initializer.sh
    environment:
      DD_DATABASE_URL: ${DD_DATABASE_URL:?Private environment required}
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: ezequiel.cuya@estudiantes.unahur.edu.ar
      DD_ADMIN_FIRST_NAME: Ezequiel
      DD_ADMIN_LAST_NAME: Cuya
      DD_INITIALIZE: ${DD_INITIALIZE:-true}
      DD_SECRET_KEY: ${DD_SECRET_KEY:?Private environment required}
      DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?Private environment
        required}
      DD_DATABASE_READINESS_TIMEOUT: '120'
      DD_ALLOWED_HOSTS: localhost,127.0.0.1
      DD_SITE_URL: http://localhost:8080
      DD_CELERY_WORKER_CONCURRENCY: '2'
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?Private environment required}
    volumes:
    - type: bind
      source: ./docker/extra_settings
      target: /app/docker/extra_settings
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 2g
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${DD_DATABASE_NAME:-defectdojo}
      POSTGRES_USER: ${DD_DATABASE_USER:-defectdojo}
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:?Private environment required}
    volumes:
    - defectdojo_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U defectdojo -d defectdojo
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
    - defectdojo_redis:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 256m
volumes:
  defectdojo_postgres: {}
  defectdojo_media: {}
  defectdojo_redis: {}
name: tp18-defectdojo
